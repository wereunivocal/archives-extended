name: PHPCS for Archives Widget Extended

# Credits: https://github.com/WordPress/wordpress.org/blob/trunk/.github/workflows/phpcs.yml

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.php'
      - phpcs.xml.dist
      - composer.json
      - .github/workflows/phpcs.yml
  push:
    branches:
      - main
      - develop
    paths:
      - '**.php'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: composer run phpcs
