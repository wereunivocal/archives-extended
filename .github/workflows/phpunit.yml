name: PHPUnit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

jobs:
  test:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    # Explicit combinations rather than a cross product: the PHP floor and
    # ceiling on each older supported WordPress branch, the full PHP range on
    # current WordPress. Ceilings follow core's PHP compatibility table:
    # https://make.wordpress.org/core/handbook/references/php-compatibility-and-wordpress-versions/
    # `wp` is a major.minor branch resolved to its newest point release at run
    # time (see bin/wp-core-source.sh), or `latest` for the newest release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: '6.8', php-version: '8.1' }
          - { wp: '6.8', php-version: '8.4' }
          - { wp: '7.0', php-version: '8.1' }
          - { wp: '7.0', php-version: '8.4' }
          - { wp: latest, php-version: '8.1' }
          - { wp: latest, php-version: '8.2' }
          - { wp: latest, php-version: '8.3' }
          - { wp: latest, php-version: '8.4' }

    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies (root) and build
        run: |
          npm ci
          npm run build

      - name: Install npm dependencies (block) and build
        working-directory: Block/archives-widget-extended
        run: |
          npm ci
          npm run build

      # wp-env's own "latest" resolves to a git tag on the WordPress/WordPress
      # mirror, which lags releases and breaks `start` until the sync catches
      # up. WP_ENV_CORE overrides `core` for every environment, and persists
      # to the run/stop steps below (bin/wp-env.sh leaves a preset value alone).
      - name: Resolve WordPress ${{ matrix.wp }}
        env:
          WP_BRANCH: ${{ matrix.wp }}
        run: |
          set -euo pipefail
          if [ "${WP_BRANCH}" = "latest" ]; then
            core="$(bin/wp-core-source.sh)"
          else
            core="$(bin/wp-core-source.sh "${WP_BRANCH}")"
          fi
          echo "Using WordPress core source: ${core}"
          echo "WP_ENV_CORE=${core}" >> "$GITHUB_ENV"

      - name: Start wp-env
        run: npx wp-env start

      - name: Install Composer dependencies (inside wp-env)
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/archives-widget-extended composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: npm run test:phpunit

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
