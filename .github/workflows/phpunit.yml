name: PHPUnit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.1', '8.2', '8.3', '8.4' ]

    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies (root) and build
        run: |
          npm ci
          npm run build

      - name: Install npm dependencies (block) and build
        working-directory: Block/archives-widget-extended
        run: |
          npm ci
          npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Install Composer dependencies (inside wp-env)
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/archives-widget-extended composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: npm run test:phpunit

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
