name: Plugin Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install npm dependencies (root) and build
        run: |
          npm ci
          npm run build

      - name: Install npm dependencies (block) and build
        working-directory: Block/archives-widget-extended
        run: |
          npm ci
          npm run build

      - name: Install Composer runtime dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction

      - name: Assemble release artifact
        run: ./bin/build-dist.sh build/archives-widget-extended

      - name: List assembled artifact
        run: find build/archives-widget-extended -maxdepth 3 -print

      # plugin-check-action writes its own .wp-env.json with `"core": null`
      # (its wp-version input only understands 'trunk'), which resolves to a
      # git tag on the WordPress/WordPress mirror — unavailable for hours
      # after a release. WP_ENV_CORE is the only way to override it.
      - name: Resolve latest available WordPress
        run: |
          set -euo pipefail
          core="$(bin/wp-core-source.sh)"
          echo "Using WordPress core source: ${core}"
          echo "WP_ENV_CORE=${core}" >> "$GITHUB_ENV"

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/archives-widget-extended

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archives-widget-extended-release
          path: build/archives-widget-extended
          retention-days: 7
